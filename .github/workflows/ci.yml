name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore LocalAITaskManager.sln

    - name: Build
      run: dotnet build LocalAITaskManager.sln -c Release --no-restore

    - name: Test
      run: dotnet test LocalAITaskManager.sln -c Release --no-build --verbosity normal

    - name: Verify code formatting
      run: dotnet format LocalAITaskManager.sln --verify-no-changes
