name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Extract Tag Version
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Run Release Packaging
      shell: pwsh
      run: |
        .\scripts\release.ps1 -Version "${{ steps.get_version.outputs.version }}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Local AI Task Manager ${{ github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/release/v${{ steps.get_version.outputs.version }}/*.zip
          artifacts/release/v${{ steps.get_version.outputs.version }}/*.sha256
          artifacts/release/v${{ steps.get_version.outputs.version }}/*.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
